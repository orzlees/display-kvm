name: 构建候选与显式发布

"on":
  workflow_dispatch:
    inputs:
      version:
        description: 归档标签（字母数字开头，至多64字符）
        required: true
        default: 0.0.1-candidate
        type: string
      publish:
        description: 完整候选全部成功后发布到已存在的标签
        default: false
        type: boolean
      release_tag:
        description: 发布标签（仅publish=true必填，必须指向本次检出的提交）
        default: ''
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOENV: 'off'
  GOWORK: 'off'
  GOTOOLCHAIN: local
  GOFLAGS: '-mod=readonly'
  # 与desktop/go.mod现有锁定版本一致；显式预取阶段结束后构建入口统一离线。
  DESKTOP_MODULES: github.com/wailsapp/wails/v3@v3.1.0 github.com/coder/websocket@v1.8.15 github.com/ebitengine/purego@v0.11.3 github.com/go-ole/go-ole@v1.3.0 github.com/godbus/dbus/v5@v5.2.4 golang.org/x/sys@v0.49.0 golang.org/x/term@v0.47.0

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      publish: ${{ steps.identity.outputs.publish }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 固定来源、归档标签及显式发布条件
        id: identity
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          publish=false
          tag=
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
            tag=$GITHUB_REF_NAME
            publish=true
          else
            version=$INPUT_VERSION
            if [ "$INPUT_PUBLISH" = true ]; then
              [ -n "$INPUT_TAG" ] || { echo '显式发布必须提供已存在的release_tag' >&2; exit 1; }
              tag=$INPUT_TAG
              publish=true
            fi
          fi
          case "$version" in [A-Za-z0-9]*) ;; *) echo '版本标签无效' >&2; exit 1 ;; esac
          case "$version" in *[!A-Za-z0-9._-]*) echo '版本标签含非法字符' >&2; exit 1 ;; esac
          [ "${#version}" -le 64 ]
          if [ "$publish" = true ]; then
            git check-ref-format "refs/tags/$tag"
            [ "$(git rev-parse --verify "refs/tags/$tag^{commit}")" = "$commit" ] || { echo '发布标签不指向本次来源' >&2; exit 1; }
          fi
          printf 'version=%s\ncommit=%s\npublish=%s\ntag=%s\n' "$version" "$commit" "$publish" "$tag" >> "$GITHUB_OUTPUT"

  linux-tools:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # 固定官方Debian12多架构index；各runner原生运行对应镜像，不以QEMU替代。
    container:
      image: debian:12-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    env:
      TOOLS_RUN_ID: ci-tools-${{ github.run_id }}-${{ github.run_attempt }}
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - name: 隔离容器显式准备R6工具与官方deb-src索引
        shell: bash
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = "$BUILD_ARCH"
          test -f /etc/apt/sources.list.d/debian.sources
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # ddcutil 3.0.2 的显示器监测对象依赖 libudev；禁用 udev 会让该固定版本在链接时缺少监测符号。
          # 开发包用于生成对象，运行库及其源码、许可继续由闭包校验收集。
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential autoconf automake libtool pkg-config \
            meson ninja-build gperf python3 python3-jinja2 patchelf binutils dpkg-dev apt \
            gzip xz-utils tar libglib2.0-dev libjansson-dev libacl1-dev libdrm-dev libudev-dev \
            libcap-dev libmount-dev libblkid-dev libcrypt-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: 原生生成并严格验证固定版本、来源与许可
        shell: bash
        run: |
          set -euo pipefail
          # 生成器精确依赖或APT来源缺失即失败；不降级成调用宿主工具的轻包。
          python3 build/linux/bundle.py generate --arch "$BUILD_ARCH" --run-id "$TOOLS_RUN_ID" --jobs 2
          python3 build/ci-artifacts.py pack-linux --arch "$BUILD_ARCH" --run-id "$TOOLS_RUN_ID" --output "ci-transfer/linux-tools-$BUILD_ARCH.tar"
      - name: 保存原生载荷（tar保留执行位）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-tools-${{ matrix.arch }}
          path: ci-transfer/linux-tools-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 14
      - name: 保留失败现场日志
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-tools-failure-${{ matrix.arch }}
          path: build/out/${{ env.TOOLS_RUN_ID }}/work/**/build.log
          if-no-files-found: warn
          retention-days: 14

  windows-native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          architecture: ${{ matrix.arch }}
          check-latest: false
          cache: false
      - name: 原生Windows无屏产品测试
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          $stepPhase = 'toolchain'
          $stepReason = 'unknown'
          $failedPhase = $null
          $failedReason = $null
          try {
            if ((go env GOHOSTOS) -ne 'windows' -or (go env GOHOSTARCH) -ne $env:BUILD_ARCH) {
              $stepReason = 'toolchain-host-mismatch'
              throw '必须使用对应架构的原生Windows工具链'
            }
            if ((go env GOVERSION) -ne 'go1.27.3') {
              $stepReason = 'toolchain-version-mismatch'
              throw '工具链版本不符'
            }
            # PowerShell生成Windows绝对缓存路径；不复用Git Bash的/c/...路径。
            $env:GOMODCACHE = Join-Path $env:GITHUB_WORKSPACE 'desktop/.cache/gomod'
            $env:GOCACHE = Join-Path $env:GITHUB_WORKSPACE 'desktop/.cache/build'
            $env:GOTMPDIR = Join-Path $env:GITHUB_WORKSPACE 'desktop/.cache/tmp'
            New-Item -ItemType Directory -Force $env:GOMODCACHE, $env:GOCACHE, $env:GOTMPDIR | Out-Null
            $env:GOPROXY = 'https://proxy.golang.org'
            $env:GOSUMDB = 'sum.golang.org'
            $modules = $env:DESKTOP_MODULES -split ' '
            $stepPhase = 'dependency-prefetch'
            go -C desktop mod download @modules
            if ($LASTEXITCODE -ne 0) {
              $stepReason = 'dependency-download-failed'
              throw '锁定依赖预取失败'
            }
            $env:GOPROXY = 'off'
            $env:GOSUMDB = 'off'
            $stepPhase = 'test-logging'
            $testLogDirectory = Join-Path $env:RUNNER_TEMP ('displaykvm-windows-tests-' + [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory $testLogDirectory | Out-Null
            $rootTestLog = Join-Path $testLogDirectory 'root.log'
            $desktopTestLog = Join-Path $testLogDirectory 'desktop.log'
            function Write-TestFailureAnnotation([string] $Phase, [string] $LogPath, [int] $TestExitCode) {
              # 普通日志可能无法匿名读取；只从本次测试输出提取错误，不打印环境或凭据。
              # 首个错误及随后七行保留超时后的running tests等上下文，末尾六行保留包结论。
              # 每行至多160字符、共至多14行，连同转义及固定标题总计小于8KiB，避免泛发堆栈。
              $firstError = [Collections.Generic.List[string]]::new()
              $tail = [Collections.Generic.Queue[string]]::new()
              foreach ($line in [IO.File]::ReadLines($LogPath)) {
                $excerpt = $line
                if ($excerpt.Length -gt 160) { $excerpt = $excerpt.Substring(0, 157) + '...' }
                if ($tail.Count -eq 6) { $null = $tail.Dequeue() }
                $tail.Enqueue($excerpt)
                if (($firstError.Count -gt 0 -and $firstError.Count -lt 8) -or
                    ($firstError.Count -eq 0 -and $line -match '(^panic:|^fatal error:|^--- FAIL:|^FAIL(?:\s|$)|^#\s|:\d+(?::\d+)?:\s)')) {
                  $firstError.Add($excerpt)
                }
              }
              $summary = "$Phase go test exit code $TestExitCode"
              if ($firstError.Count -gt 0) { $summary += "`n首个错误及上下文：`n" + ($firstError -join "`n") }
              $summary += "`n末尾（至多六行）：`n" + ($tail -join "`n")
              $escaped = $summary.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Windows $Phase go test::$escaped"
            }
            $hadTemp = Test-Path Env:TEMP
            $hadTmp = Test-Path Env:TMP
            $originalTemp = [Environment]::GetEnvironmentVariable('TEMP', 'Process')
            $originalTmp = [Environment]::GetEnvironmentVariable('TMP', 'Process')
            $testTempCreated = $false
            $testsSucceeded = $false
            try {
              $stepPhase = 'preflight-create'
              # GOTMPDIR只管理编译临时文件；runner默认TEMP的祖先可能具有危险写入权限。
              # 仅为本步骤的测试及子进程选择当前账户LocalAppData，不修改账户配置或任何ACL。
              # 这里只检查目录身份，完整祖先安全策略仍由原生settingslock测试的生产入口执行。
              $localAppData = [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)
              if (-not [IO.Path]::IsPathFullyQualified($localAppData)) {
                $stepReason = 'invalidpath'
                throw 'LocalAppData必须是既存绝对目录'
              }
              $localAppData = [IO.Path]::GetFullPath($localAppData)
              $localDriveRoot = [IO.Path]::GetPathRoot($localAppData)
              if ($localDriveRoot -notmatch '^[A-Za-z]:\\$' -or ([IO.DriveInfo]::new($localDriveRoot)).DriveType -ne [IO.DriveType]::Fixed) {
                $stepReason = 'invalidpath'
                throw 'LocalAppData必须位于固定本地盘'
              }
              $localDirectory = Get-Item -LiteralPath $localAppData -Force
              if (-not $localDirectory.PSIsContainer -or ($localDirectory.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                $stepReason = 'invalidpath'
                throw 'LocalAppData必须是普通非重解析目录'
              }
              $localAppData = $localDirectory.FullName
              $currentIdentity = [Security.Principal.WindowsIdentity]::GetCurrent()
              $currentUserSid = $currentIdentity.User
              $testTempLeaf = 'displaykvm-native-tests-' + [Guid]::NewGuid().ToString('N')
              $testTempRoot = Join-Path $localAppData $testTempLeaf
              if (Test-Path -LiteralPath $testTempRoot) {
                $stepReason = 'path-already-exists'
                throw '测试临时目录名称已存在，拒绝复用'
              }
              # 不使用-Force；只有独占创建成功后才记录归属，不能接管既有对象。
              New-Item -Path $localAppData -Name $testTempLeaf -ItemType Directory | Out-Null
              $testTempCreated = $true
              $stepPhase = 'preflight-validate'
              $ownerMatchesUser = 'unknown'
              $ownerMatchesDefaultOwner = 'unknown'
              $ownerCategory = 'other'
              $testTempDirectory = Get-Item -LiteralPath $testTempRoot -Force
              if (-not $testTempDirectory.PSIsContainer -or
                  ($testTempDirectory.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                  -not [string]::Equals($testTempDirectory.FullName, $testTempRoot, [StringComparison]::OrdinalIgnoreCase) -or
                  -not [string]::Equals($testTempDirectory.Parent.FullName, $localAppData, [StringComparison]::OrdinalIgnoreCase)) {
                $stepReason = 'invalidpath'
                throw '测试临时根目录类型或路径不符'
              }
              $actualOwnerSid = (Get-Acl -LiteralPath $testTempRoot).GetOwner([Security.Principal.SecurityIdentifier])
              $tokenOwnerSid = $null
              # 默认对象owner可能不同于令牌User；只输出关系与固定类别，不公开SID、账户名或路径。
              # Owner诊断读取失败或返回null时标记unknown，不能因此替代原owner guard的真实异常。
              try { $tokenOwnerSid = $currentIdentity.Owner }
              catch { $tokenOwnerSid = $null }
              if ($null -ne $actualOwnerSid -and $null -ne $currentUserSid) {
                $ownerMatchesUser = 'false'
                if ($actualOwnerSid.Value -eq $currentUserSid.Value) {
                  $ownerMatchesUser = 'true'
                  $ownerCategory = 'current-user'
                }
              }
              if ($null -ne $actualOwnerSid -and $null -ne $tokenOwnerSid) {
                $ownerMatchesDefaultOwner = 'false'
                if ($actualOwnerSid.Value -eq $tokenOwnerSid.Value) { $ownerMatchesDefaultOwner = 'true' }
              }
              # SYSTEM与Administrators的固定SID仅用于诊断分类，不扩展任何目录准入规则。
              if ($ownerCategory -eq 'other' -and $null -ne $actualOwnerSid -and
                  @('S-1-5-18', 'S-1-5-32-544') -contains $actualOwnerSid.Value) {
                $ownerCategory = 'fixed-trusted-group'
              }
              Write-Host "Windows preflight owner_matches_user=$ownerMatchesUser owner_matches_default_owner=$ownerMatchesDefaultOwner owner_category=$ownerCategory"
              if ($actualOwnerSid.Value -ne $currentUserSid.Value) {
                $stepReason = 'owner-mismatch'
                throw '测试临时根目录必须由当前令牌账户所有'
              }
              $env:TEMP = $testTempRoot
              $env:TMP = $testTempRoot
              # 非零退出由下面显式处理，避免原生命令错误偏好提前打断输出捕获；
              # Tee只复制stdout/stderr，不改变测试参数，退出码须立即保存，失败不继续desktop。
              $PSNativeCommandUseErrorActionPreference = $false
              $stepPhase = 'root-tests'
              go test ./cmd/... ./internal/... -count=1 2>&1 | Tee-Object -FilePath $rootTestLog
              $rootTestExitCode = $LASTEXITCODE
              if ($rootTestExitCode -ne 0) {
                $failedPhase = $stepPhase
                $failedReason = 'go-test-failed'
                try { Write-TestFailureAnnotation 'root' $rootTestLog $rootTestExitCode }
                catch { Write-Host '::error::无法生成root测试摘要；完整输出见当前步骤日志。' }
                finally { exit $rootTestExitCode }
              }
              $stepPhase = 'desktop-tests'
              go -C desktop test ./... -count=1 2>&1 | Tee-Object -FilePath $desktopTestLog
              $desktopTestExitCode = $LASTEXITCODE
              if ($desktopTestExitCode -ne 0) {
                $failedPhase = $stepPhase
                $failedReason = 'go-test-failed'
                try { Write-TestFailureAnnotation 'desktop' $desktopTestLog $desktopTestExitCode }
                catch { Write-Host '::error::无法生成desktop测试摘要；完整输出见当前步骤日志。' }
                finally { exit $desktopTestExitCode }
              }
              $testsSucceeded = $true
            } catch {
              # 在finally切换到cleanup阶段前冻结首次失败，防止owner预检被误报为清理失败。
              if ($null -eq $failedPhase) {
                $failedPhase = $stepPhase
                $failedReason = $stepReason
              }
              throw
            } finally {
              $stepPhase = 'cleanup'
              $stepReason = 'unknown'
              # 还原本进程原值，也区分原本未定义；恢复或清理错误不能覆盖测试的原始失败退出码。
              $restoreFailed = $false
              try {
                if ($hadTemp) { $env:TEMP = $originalTemp }
                else { [Environment]::SetEnvironmentVariable('TEMP', $null, 'Process') }
              } catch {
                $restoreFailed = $true
                Write-Host '::warning::无法恢复本步骤TEMP进程变量。'
              }
              try {
                if ($hadTmp) { $env:TMP = $originalTmp }
                else { [Environment]::SetEnvironmentVariable('TMP', $null, 'Process') }
              } catch {
                $restoreFailed = $true
                Write-Host '::warning::无法恢复本步骤TMP进程变量。'
              }
              if ($testsSucceeded -and $testTempCreated -and -not $restoreFailed) {
                try {
                  $testTempDirectory = Get-Item -LiteralPath $testTempRoot -Force
                  if (-not $testTempDirectory.PSIsContainer -or
                      ($testTempDirectory.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                      -not [string]::Equals($testTempDirectory.FullName, $testTempRoot, [StringComparison]::OrdinalIgnoreCase) -or
                      -not [string]::Equals($testTempDirectory.Parent.FullName, $localAppData, [StringComparison]::OrdinalIgnoreCase) -or
                      (Get-Acl -LiteralPath $testTempRoot).GetOwner([Security.Principal.SecurityIdentifier]).Value -ne $currentUserSid.Value) {
                    throw '本次临时根目录身份已改变，保留目录'
                  }
                  # 仅删除本次拥有的空根目录，不递归、不跟随链接，也不清理LocalAppData父目录。
                  [IO.Directory]::Delete($testTempRoot, $false)
                } catch {
                  Write-Host '本次测试临时目录非空或无法安全确认，已保留；未递归清理。'
                }
              } elseif ($testTempCreated) {
                Write-Host '测试未全部成功或临时变量未恢复，保留本次临时目录与RunnerTemp测试日志。'
              }
              if ($restoreFailed -and $testsSucceeded) {
                $stepReason = 'temp-restore-failed'
                throw '无法恢复本步骤TEMP/TMP进程变量'
              }
            }
          } catch {
            $diagnosticPhase = [string] $stepPhase
            $diagnosticReason = [string] $stepReason
            if ($null -ne $failedPhase) {
              $diagnosticPhase = [string] $failedPhase
              $diagnosticReason = [string] $failedReason
            }
            # 公开注释只含受控字段及owner关系，禁止使用可能带主机身份的Message或原始SID。
            # 字段分别截断并复用workflow命令转义，总量远小于8KiB；随后重抛原异常。
            $diagnosticPhase = $diagnosticPhase.Substring(0, [Math]::Min(32, $diagnosticPhase.Length))
            $diagnosticReason = $diagnosticReason.Substring(0, [Math]::Min(32, $diagnosticReason.Length))
            $diagnosticType = [string] $_.Exception.GetType().FullName
            $diagnosticType = $diagnosticType.Substring(0, [Math]::Min(96, $diagnosticType.Length))
            $diagnosticLine = [string] $_.InvocationInfo.ScriptLineNumber
            $diagnosticLine = $diagnosticLine.Substring(0, [Math]::Min(12, $diagnosticLine.Length))
            $diagnostic = "phase=$diagnosticPhase exceptionType=$diagnosticType scriptLine=$diagnosticLine reason=$diagnosticReason"
            if ($diagnosticPhase -eq 'preflight-validate') {
              $diagnostic += " owner_matches_user=$ownerMatchesUser owner_matches_default_owner=$ownerMatchesDefaultOwner owner_category=$ownerCategory"
            }
            $escaped = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows test step::$escaped"
            throw
          }

  core:
    # 缺任一Linux原生物料或Windows原生测试失败，完整六平台候选不能开始。
    needs: [prepare, linux-tools, windows-native]
    runs-on: macos-26
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_RUN_ID: ci-core-${{ github.run_id }}-${{ github.run_attempt }}
      TOOLS_RUN_ID: ci-tools-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: linux-tools-*
          path: ci-input/linux
          merge-multiple: true
      - name: 合并身份与双架构载荷，再构建及许可包装
        run: |
          set -eu
          python3 build/ci-artifacts.py merge-linux --run-id "$TOOLS_RUN_ID" --artifacts ci-input/linux
          sh build/build-core.sh --target all --version "$BUILD_VERSION" --run-id "$BUILD_RUN_ID" --linux-tools-run-id "$TOOLS_RUN_ID"
          sh packaging/package.sh core --run-id "$BUILD_RUN_ID"
      - name: 六平台可下载归档及摘要
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-core
          path: |
            build/out/${{ env.BUILD_RUN_ID }}/dist/*.tar.gz
            build/out/${{ env.BUILD_RUN_ID }}/dist/*.zip
            build/out/${{ env.BUILD_RUN_ID }}/dist/*.sha256
            build/out/${{ env.BUILD_RUN_ID }}/dist/archives.json
          if-no-files-found: error
          retention-days: 30

  desktop-windows:
    needs: [prepare, core]
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARCH: ${{ matrix.arch }}
      CORE_RUN_ID: ci-wincore-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      GUI_RUN_ID: ci-wingui-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      PACKAGE_RUN_ID: ci-winzip-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: 显式预取锁定桌面依赖
        run: |
          set -eu
          export GOMODCACHE="$PWD/desktop/.cache/gomod" GOCACHE="$PWD/desktop/.cache/build"
          export GOTMPDIR="$PWD/desktop/.cache/tmp" TMPDIR="$PWD/desktop/.cache/tmp"
          export GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org
          mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOTMPDIR"
          go -C desktop mod download $DESKTOP_MODULES
      - name: 两角色核心、真实Windows GUI与三程序ZIP
        run: |
          set -eu
          sh build/build-core.sh --target "windows-$BUILD_ARCH" --version "$BUILD_VERSION" --run-id "$CORE_RUN_ID"
          sh build/build-windows.sh --target "windows-$BUILD_ARCH" --version "$BUILD_VERSION" --run-id "$GUI_RUN_ID"
          sh packaging/package.sh windows --run-id "$PACKAGE_RUN_ID" --app "build/out/$GUI_RUN_ID/displaykvm.exe" --core-run-id "$CORE_RUN_ID"
      - name: Windows可下载ZIP及摘要
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-windows-${{ matrix.arch }}
          path: |
            build/out/${{ env.PACKAGE_RUN_ID }}/dist/*.zip
            build/out/${{ env.PACKAGE_RUN_ID }}/dist/*.sha256
            build/out/${{ env.PACKAGE_RUN_ID }}/dist/archives.json
          if-no-files-found: error
          retention-days: 30

  desktop-macos-arm64:
    needs: [prepare, core]
    runs-on: macos-26
    env:
      BUILD_RUN_ID: ci-desktop-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: 确认原生arm64并显式预取锁定依赖
        run: |
          set -eu
          test "$(uname -m)" = arm64
          export GOMODCACHE="$PWD/desktop/.cache/gomod" GOCACHE="$PWD/desktop/.cache/build"
          export GOTMPDIR="$PWD/desktop/.cache/tmp" TMPDIR="$PWD/desktop/.cache/tmp"
          export GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org
          mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOTMPDIR"
          go -C desktop mod download $DESKTOP_MODULES
      - name: 原生桌面构建与只读成品包装
        run: |
          set -eu
          sh desktop/build-macos.sh
          sh packaging/package.sh desktop --app desktop/bin/DisplayKvm.app --run-id "$BUILD_RUN_ID"
      - name: 保留macOS arm64 GUI候选
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-macos-arm64
          path: |
            build/out/${{ env.BUILD_RUN_ID }}/dist/*.tar.gz
            build/out/${{ env.BUILD_RUN_ID }}/dist/*.sha256
            build/out/${{ env.BUILD_RUN_ID }}/dist/archives.json
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [prepare, core, desktop-windows, desktop-macos-arm64]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    # 写权限只给予全部门控通过后的发布job；构建和测试仅可读仓库。
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-*
          path: ci-candidates
      - name: 要求全部九份候选并复核归档摘要
        run: python3 build/ci-artifacts.py collect-release --version "$BUILD_VERSION" --artifacts ci-candidates --output ci-release
      - name: 保存通过发布前校验的下载材料
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidates
          path: ci-release/*
          if-no-files-found: error
          retention-days: 30
      - name: 官方CLI创建草稿并上传成功后发布候选
        shell: bash
        run: |
          set -euo pipefail
          # 不覆盖既有Release；上传失败保留草稿及job错误，避免伪称发布成功。
          # --verify-tag禁止CLI隐式创建标签；普通手动构建不会进入本job。
          gh release create "$RELEASE_TAG" ci-release/*.zip ci-release/*.tar.gz ci-release/*.sha256 \
            --verify-tag --draft --prerelease --title "$RELEASE_TAG" --notes-file ci-release/RELEASE-NOTES.txt
          gh release edit "$RELEASE_TAG" --draft=false
